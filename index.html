<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I'm Really Sorry</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
height:100vh;
overflow:hidden;
background:linear-gradient(135deg,#ff758c,#ff7eb3);
display:flex;
align-items:center;
justify-content:center;
}

/* floating hearts */

.heart{
position:absolute;
font-size:24px;
animation:float 8s linear infinite;
opacity:0.8;
}

@keyframes float{
0%{transform:translateY(100vh) scale(0.5)}
100%{transform:translateY(-10vh) scale(1.2)}
}

/* popup */

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
display:flex;
align-items:center;
justify-content:center;
}

.box{
background:white;
padding:30px;
border-radius:15px;
text-align:center;
max-width:320px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.box h2{
margin-bottom:15px;
color:#ff4d6d;
}

.box p{
margin-bottom:20px;
color:#444;
}

button{
padding:10px 18px;
margin:8px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

.yes{
background:#4CAF50;
color:white;
}

.no{
background:#ff4d6d;
color:white;
}

</style>
</head>

<body>

<audio autoplay loop>
<source src="https://cdn.pixabay.com/audio/2022/03/15/audio_115b9b4c33.mp3" type="audio/mpeg">
</audio>

<div class="modal" id="modal">
<div class="box">
<h2>I'm Really Sorry</h2>
<p>sry for that... it will never happen again 🥺</p>
<button class="yes" onclick="accept()">Yes</button>
<button class="no" onclick="reject()">No</button>
</div>
</div>

<script>

/* floating hearts */

function createHeart(){
const heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="💗";
heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(5+Math.random()*5)+"s";
document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},8000);
}

setInterval(createHeart,300);

/* popup logic */

function reject(){
const modal=document.getElementById("modal");
modal.style.display="none";

setTimeout(()=>{
modal.style.display="flex";
},600);
}

function accept(){
document.getElementById("modal").innerHTML=
"<div class='box'><h2>Thank You ❤️</h2><p>You mean a lot to me. I promise I'll do better.</p></div>";
}

</script>

</body>
</html>
