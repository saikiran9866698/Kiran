<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I'm Sorry</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
height:100vh;
overflow:hidden;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
display:flex;
align-items:center;
justify-content:center;
}

/* floating sorry text */

.sorry{
position:absolute;
color:white;
font-size:20px;
opacity:0.8;
animation:float 8s linear infinite;
}

@keyframes float{
0%{transform:translateY(100vh)}
100%{transform:translateY(-100vh)}
}

/* popup */

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
display:flex;
align-items:center;
justify-content:center;
}

.box{
background:white;
padding:30px;
border-radius:12px;
text-align:center;
max-width:320px;
}

.box h2{
margin-bottom:20px;
}

button{
padding:10px 18px;
margin:8px;
border:none;
border-radius:6px;
cursor:pointer;
font-size:16px;
}

.yes{
background:#4CAF50;
color:white;
}

.no{
background:#f44336;
color:white;
}
</style>
</head>

<body>

<div class="modal" id="modal">
<div class="box">
<h2>sry for that it will never happen again</h2>
<button class="yes" onclick="accept()">Yes</button>
<button class="no" onclick="reject()">No</button>
</div>
</div>

<script>

/* floating sorry generator */

function createSorry(){
const s=document.createElement("div");
s.className="sorry";
s.innerText="Sorry";
s.style.left=Math.random()*100+"vw";
s.style.animationDuration=(5+Math.random()*5)+"s";
document.body.appendChild(s);

setTimeout(()=>{s.remove()},9000);
}

setInterval(createSorry,400);

/* popup logic */

function reject(){
const modal=document.getElementById("modal");
modal.style.display="none";

setTimeout(()=>{
modal.style.display="flex";
},500);
}

function accept(){
document.getElementById("modal").innerHTML=
"<div class='box'><h2>Thank you ❤️</h2><p>I promise it won't happen again.</p></div>";
}

/* try fullscreen for stronger effect */

document.body.addEventListener("click",()=>{
if(document.documentElement.requestFullscreen){
document.documentElement.requestFullscreen();
}
},{once:true});

</script>

</body>
</html>
